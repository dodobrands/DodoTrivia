                    "Пока ждали электриков, организовала ужин при свечах из остывшей пиццы",
                    "За свой счёт заказала гостям такси до ближайшего работающего ресторана"
                ],
                chk: "a0xlhn"
            },
            {
                q: "В чём заключается стратегия «План 333», опубликованная в 2021 году?",
                opts: [
                    "Открытие 333 новых пиццерий ежегодно на протяжении следующих трёх лет",
                    "Развитие трёх брендов в течение трёх лет с целью получения прибыли в 30 миллионов долларов",
                    "Выход на рынки 3 стран Европы, 3 стран Азии и 3 стран Африки",
                    "Достижение стабильного времени доставки в 33 минуты во всех городах"
                ],
                chk: "1o293df"
            },
            {
                q: "Какая политика применяется в «Додо Пицце» в отношении штрафов для сотрудников?",
                opts: [
                    "Штрафуют исключительно за грубые нарушения стандартов безопасности на кухне",
                    "Сумма штрафа никогда не может превышать 10% от ежемесячной зарплаты",
                    "Сотрудников вообще не штрафуют, так как у каждого есть право на ошибку",
                    "Оштрафовать сотрудника имеет право только управляющий пиццерией"
                ],
                chk: "y8bmt4"
            },
            {
                q: "Каким бизнесом занимался Фёдор Овчинников до того, как открыл первую «Додо Пиццу»?",
                opts: [
                    "Владел точками по продаже кислородных коктейлей в торговых центрах",
                    "Управлял по франшизе ресторанами McDonald's в Сыктывкаре",
                    "Создавал цифровые системы управления для заведений общепита",
                    "Развивал сеть книжных магазинов «Сила ума», которая обанкротилась"
                ],
                chk: "1q6rfvy"
            },
            {
                q: "Какой способ финансирования помог компании в 2015 году привлечь более 100 миллионов рублей на развитие?",
                opts: [
                    "Краудфандинг — инвестиции от обычных людей, поверивших в компанию",
                    "Первичное размещение акций (IPO) на фондовой бирже",
                    "Крупный банковский кредит на неотложные нужды бизнеса",
                    "Продажа контрольного пакета акций международным инвесторам"
                ],
                chk: "a56ahw"
            },
            {
                q: "Кто стал первым частным инвестором «Додо Пиццы» в феврале 2012 года?",
                opts: [
                    "Британский клиент пиццерии Райан Оливер",
                    "Топ-менеджер «Яндекса» Василий Филиппов",
                    "Франчайзи из Москвы Владимир Горецкий",
                    "Китайский инвестор из компании Alibaba Group"
                ],
                chk: "19b7c2j"
            }
        ];

        function fnv(s) {
            let h = 0x811c9dc5;
            for (let i = 0; i < s.length; i++) {
                h ^= s.charCodeAt(i);
                h = Math.imul(h, 0x01000193) >>> 0;
            }
            return h.toString(36);
        }

        const SESSION_SIZE = 15;
        const app = document.getElementById("app");
        let questions, qIdx, score;

        function shuffle(arr) {
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        function start() {
            questions = shuffle([...QUESTIONS]).slice(0, SESSION_SIZE);
            qIdx = 0;
            score = 0;
            renderQuestion();
        }

        function renderQuestion() {
            if (qIdx >= questions.length) { renderResult(); return; }

            const item = questions[qIdx];
            const pct = (qIdx / questions.length * 100).toFixed(0);

            // Shuffle display order of options, track correct by chk
            const displayOpts = shuffle(item.opts.map((text, i) => ({ text, i })));

            let html = `
                <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
                <div class="counter">Вопрос ${qIdx + 1} из ${questions.length}</div>
                <div class="card">
                    <div class="question">${item.q}</div>
                    <div class="options">`;

            displayOpts.forEach((opt, di) => {
                html += `<button class="opt" data-di="${di}">${opt.text}</button>`;
            });

            html += `</div></div>`;
            app.innerHTML = html;

            app.querySelectorAll(".opt").forEach(btn => {
                btn.addEventListener("click", () => {
                    const di = parseInt(btn.dataset.di);
                    const clickedText = displayOpts[di].text;
                    const isCorrect = fnv(clickedText) === item.chk;

                    app.querySelectorAll(".opt").forEach((b, bi) => {
                        b.disabled = true;
                        if (fnv(displayOpts[bi].text) === item.chk) b.classList.add("correct");
                        if (bi === di && !isCorrect) b.classList.add("wrong");
                    });

                    if (isCorrect) score++;
                    setTimeout(() => { qIdx++; renderQuestion(); }, 1500);
                });
            });
        }

        function renderResult() {
            const pct = Math.round(score / questions.length * 100);
            let icon, message;
            if (pct === 100)      { icon = "🏆"; message = "Идеально! Ты настоящий знаток Додо!"; }
            else if (pct >= 80)   { icon = "🔥"; message = "Отличный результат! Ты знаешь Додо очень хорошо!"; }
            else if (pct >= 60)   { icon = "👍"; message = "Неплохо! Но есть что подучить."; }
            else if (pct >= 40)   { icon = "🤔"; message = "Средний результат. Пора почитать про историю Додо!"; }
            else                  { icon = "📚"; message = "Есть куда расти! Попробуй ещё раз?"; }

            app.innerHTML = `
                <div class="progress-bar"><div class="progress-fill" style="width:100%"></div></div>
                <div class="result">
                    <div class="result-icon">${icon}</div>
                    <div class="result-score">${score} / ${questions.length}</div>
                    <div class="result-label">правильных ответов (${pct}%)</div>
                    <div class="result-message">${message}</div>
                    <button class="restart-btn" id="restart-btn">🔄 Пройти ещё раз</button>
                </div>`;
            document.getElementById("restart-btn").addEventListener("click", start);
        }

        start();
    })();
    </script>
