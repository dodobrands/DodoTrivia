        function fnv(s) {
            let h = 0x811c9dc5;
            for (let i = 0; i < s.length; i++) {
                h ^= s.charCodeAt(i);
                h = Math.imul(h, 0x01000193) >>> 0;
            }
            return h.toString(36);
        }

        const AudioEngine = (() => {
            let ctx = null, bgOscs = [], bgGain = null, bgInterval = null, muted = true;

            function ac() {
                if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)();
                return ctx;
            }

            function tone(freq, type, startT, duration, peakGain) {
                if (muted) return;
                const c = ac();
                const osc = c.createOscillator();
                const g = c.createGain();
                osc.type = type;
                osc.frequency.setValueAtTime(freq, startT);
                g.gain.setValueAtTime(0, startT);
                g.gain.linearRampToValueAtTime(peakGain, startT + 0.02);
                g.gain.exponentialRampToValueAtTime(0.001, startT + duration);
                osc.connect(g); g.connect(c.destination);
                osc.start(startT); osc.stop(startT + duration);
            }

            return {
                playCorrect() {
                    if (muted) return;
                    const c = ac(), t = c.currentTime;
                    tone(523.25, 'sine', t,       0.25, 0.3);  // C5
                    tone(659.25, 'sine', t + 0.08, 0.25, 0.3); // E5
                    tone(783.99, 'sine', t + 0.16, 0.4,  0.3); // G5
                },

                playWrong() {
                    if (muted) return;
                    const c = ac(), t = c.currentTime;
                    tone(220, 'sawtooth', t,       0.15, 0.2);
                    tone(180, 'sawtooth', t + 0.1, 0.25, 0.15);
                },

                playTick(urgent) {
                    if (muted) return;
                    const c = ac(), t = c.currentTime;
                    const osc = c.createOscillator();
                    const g = c.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(urgent ? 1400 : 900, t);
                    g.gain.setValueAtTime(urgent ? 0.18 : 0.07, t);
                    g.gain.exponentialRampToValueAtTime(0.001, t + 0.04);
                    osc.connect(g); g.connect(c.destination);
                    osc.start(t); osc.stop(t + 0.04);
                },

                startBg() {},

                stopBg() {
                    if (bgInterval) { clearInterval(bgInterval); bgInterval = null; }
                    if (bgGain && ctx) {
                        bgGain.gain.linearRampToValueAtTime(0, ctx.currentTime + 1);
                        setTimeout(() => {
                            bgOscs.forEach(o => { try { o.stop(); } catch(e) {} });
                            bgOscs = [];
                            bgGain = null;
                        }, 1100);
                    }
                },

                toggleMute() {
                    muted = !muted;
                    if (muted) { if (bgGain && ctx) bgGain.gain.setValueAtTime(0, ctx.currentTime); }
                    else { if (bgGain && ctx) bgGain.gain.setValueAtTime(0.06, ctx.currentTime); }
                    return muted;
                }
            };
        })();

        const SESSION_SIZE = 15;
        const QUESTION_TIME = 60;
        const app = document.getElementById("app");
        let questions, qIdx, score, timerInterval;

        function shuffle(arr) {
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        function renderStart() {
            app.innerHTML = `
                <div class="start-screen">
                    <div class="start-logo">🍕 🌯 ☕️</div>
                    <div class="start-title">Викторина о Додо</div>
                    <div class="start-subtitle">Насколько хорошо ты знаешь «Додо»?<br>${SESSION_SIZE} вопросов, чтобы проверить себя.</div>
                    <button class="start-btn" id="start-btn">Начать</button>
                </div>`;
            document.getElementById("start-btn").addEventListener("click", start);
        }

        function start() {
            questions = shuffle([...QUESTIONS]).slice(0, SESSION_SIZE);
            qIdx = 0;
            score = 0;
            AudioEngine.startBg();
            renderQuestion();
        }

        function stopTimer() {
            if (timerInterval) { cancelAnimationFrame(timerInterval); timerInterval = null; }
        }

        function buildStories(activeIdx, activePct) {
            let html = '<div class="stories">';
            for (let i = 0; i < questions.length; i++) {
                const w = i < activeIdx ? 100 : i === activeIdx ? activePct : 0;
                html += `<div class="story-seg"><div class="story-fill" ${i === activeIdx ? 'id="active-fill"' : ''} style="width:${w}%"></div></div>`;
            }
            return html + '</div>';
        }

        function renderQuestion() {
            if (qIdx >= questions.length) { renderResult(); return; }

            stopTimer();

            const item = questions[qIdx];
            const displayOpts = shuffle(item.opts.map((text, i) => ({ text, i })));

            let html = buildStories(qIdx, 0) + `
                <div class="countdown" id="countdown"></div>
                <div class="card">
                    <div class="question">${item.q}</div>
                    <div class="options">`;

            displayOpts.forEach((opt, di) => {
                html += `<button class="opt" data-di="${di}">${opt.text}</button>`;
            });

            html += `</div></div>`;
            app.innerHTML = html;

            const fillEl = document.getElementById("active-fill");
            const countdownEl = document.getElementById("countdown");
            const duration = QUESTION_TIME * 1000;
            let startTs = null;

            function tick(ts) {
                if (!startTs) startTs = ts;
                const elapsed = ts - startTs;
                const pct = Math.min(elapsed / duration * 100, 100);
                fillEl.style.width = pct + "%";
                // white → orange (60–80%) → red (80–100%)
                let r, g, b;
                if (pct < 60) {
                    r = 255; g = 255; b = 255;
                } else if (pct < 80) {
                    const t = (pct - 60) / 20;
                    r = 255; g = Math.round(255 + t * (107 - 255)); b = Math.round(255 + t * (53 - 255));
                } else {
                    const t = (pct - 80) / 20;
                    r = Math.round(255 + t * (244 - 255)); g = Math.round(107 + t * (67 - 107)); b = Math.round(53 + t * (54 - 53));
                }
                fillEl.style.background = `rgb(${r},${g},${b})`;
                const secondsLeft = Math.ceil((duration - elapsed) / 1000);
                if (secondsLeft <= 15) {
                    countdownEl.textContent = secondsLeft > 0 ? secondsLeft : 0;
                    countdownEl.classList.add("visible");
                }
if (pct < 100) {
                    timerInterval = requestAnimationFrame(tick);
                } else {
                    timerInterval = null;
                    app.querySelectorAll(".opt").forEach((b, bi) => {
                        b.disabled = true;
                        if (fnv(displayOpts[bi].text) === item.chk) b.classList.add("correct");
                    });
                    setTimeout(() => { qIdx++; renderQuestion(); }, 1500);
                }
            }

            timerInterval = requestAnimationFrame(tick);

            app.querySelectorAll(".opt").forEach(btn => {
                btn.addEventListener("click", () => {
                    stopTimer();
                    const di = parseInt(btn.dataset.di);
                    const isCorrect = fnv(displayOpts[di].text) === item.chk;
                    app.querySelectorAll(".opt").forEach((b, bi) => {
                        b.disabled = true;
                        if (fnv(displayOpts[bi].text) === item.chk) b.classList.add("correct");
                        if (bi === di && !isCorrect) b.classList.add("wrong");
                    });
                    if (isCorrect) { score++; AudioEngine.playCorrect(); }
                    else { AudioEngine.playWrong(); }
                    setTimeout(() => { qIdx++; renderQuestion(); }, 1500);
                });
            });
        }

        function renderResult() {
            stopTimer();
            AudioEngine.stopBg();
            const pct = Math.round(score / questions.length * 100);
            let icon, message;
            if (pct === 100)      { icon = "🏆"; message = "Идеально! Ты настоящий знаток Додо!"; }
            else if (pct >= 80)   { icon = "🔥"; message = "Отличный результат! Ты знаешь Додо очень хорошо!"; }
            else if (pct >= 60)   { icon = "👍"; message = "Неплохо! Но есть что подучить."; }
            else if (pct >= 40)   { icon = "🤔"; message = "Средний результат. Пора почитать про историю Додо!"; }
            else                  { icon = "📚"; message = "Есть куда расти! Попробуй ещё раз?"; }

            app.innerHTML = buildStories(questions.length, 0) + `
                <div class="result">
                    <div class="result-icon">${icon}</div>
                    <div class="result-score">${score} / ${questions.length}</div>
                    <div class="result-label">правильных ответов (${pct}%)</div>
                    <div class="result-message">${message}</div>
                    <button class="restart-btn" id="restart-btn">🔄 Пройти ещё раз</button>
                </div>`;

            document.getElementById("restart-btn").addEventListener("click", renderStart);
        }

        document.getElementById("mute-btn").addEventListener("click", () => {
            const m = AudioEngine.toggleMute();
            document.getElementById("mute-btn").textContent = m ? "🔇" : "🔊";
        });

        renderStart();
    })();
    </script>
</body>
</html>
