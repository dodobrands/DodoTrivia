<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dodo Trivia QR</title>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: #0f0f23;
    color: #e0e0e0;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    padding: 40px 20px;
  }
  h1 {
    font-size: 3rem;
    margin-bottom: 12px;
    color: #ff6b35;
    text-align: center;
  }
  .subtitle {
    font-size: 1.1rem;
    color: #888;
    margin-bottom: 36px;
    text-align: center;
  }
  #qr {
    padding: 24px;
    background: #1a1a2e;
    border: 1px solid #2a2a4a;
    border-radius: 16px;
  }
  #qr img { display: block; }
  .cta {
    display: inline-block;
    margin-top: 32px;
    padding: 16px 48px;
    background: #ff6b35;
    color: #fff;
    font-size: 1.2rem;
    font-weight: 600;
    border-radius: 12px;
    text-decoration: none;
    transition: background 0.2s;
  }
  .cta:hover { background: #e55a2b; }
</style>
</head>
<body>
  <h1>Викторина о Додо</h1>
  <p class="subtitle">Наведи камеру и проверь свои знания о Додо</p>
  <div id="qr"></div>
  <a class="cta" href="https://dodobrands.github.io/DodoTrivia/">Играть</a>
  <script>
    var qr = qrcode(0, 'M');
    qr.addData('https://dodobrands.github.io/DodoTrivia/');
    qr.make();
    document.getElementById('qr').innerHTML = qr.createImgTag(10, 0);
  </script>
</body>
</html>
